# ---------------------------------------------------------------------------
# Директивы для Plesk, если сайт отдаётся ТОЛЬКО nginx (без Apache).
#
# Куда вставить:
#   Plesk → Websites & Domains → <ваш домен> → Apache & nginx Settings
#   → поле «Additional nginx directives» → вставить и нажать OK.
#
# Если в цепочке есть Apache (стандартная схема Plesk: nginx → Apache),
# ничего вставлять не нужно — работает файл .htaccess из корня сайта.
# ---------------------------------------------------------------------------

# SPA-fallback: несуществующие пути отдаём index.html, маршрут разберёт роутер
location / {
    try_files $uri $uri/ /index.html;
}

# Хешированные ассеты неизменяемы — кешируем надолго
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# index.html не кешируем, иначе после деплоя пользователи получат старую сборку
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# Видео-заставка: отдача по диапазонам байт
location ~* \.mp4$ {
    add_header Accept-Ranges bytes;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Сжатие текстовых ресурсов
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
