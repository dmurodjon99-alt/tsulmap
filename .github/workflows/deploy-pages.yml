# Публикация на GitHub Pages.
#
# ВАЖНО, один раз в настройках репозитория:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Шаг configure-pages ниже пытается включить Pages сам, но это получится только
# если Settings → Actions → General → Workflow permissions = «Read and write».
# По умолчанию у новых репозиториев там read-only, и API отвечает
# «Resource not accessible by integration». Поэтому шаг помечен
# continue-on-error: сборка от него не зависит и артефакт собирается в любом
# случае — не хватает лишь включённого Pages для последнего шага.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний коммит
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Необязательная попытка включить Pages автоматически.
      - name: Configure Pages (best effort)
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      # Базовый путь зависит от того, как опубликован сайт:
      #   project site        → /<repo>/
      #   user/org site       → /
      #   свой домен (CNAME)  → /   (сайт лежит в корне домена)
      # configure-pages знает про все три случая и отдаёт base_path, но шаг
      # может не отработать (нет прав) — тогда считаем путь из имени репозитория.
      - name: Resolve base path
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "VITE_BASE=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_ENV"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Show resolved base
        run: 'grep -o ''src="[^"]*assets[^"]*"'' dist/index.html'

      # GitHub Pages не умеет SPA-fallback: копия index.html как 404.html
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
